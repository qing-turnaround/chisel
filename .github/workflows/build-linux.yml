name: build-binaries

on:
  workflow_dispatch:
  push:
    branches: [master, fix-goroutine-leak]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/build-linux.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build chisel binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact: chisel-linux-amd64
            binary: chisel
          - goos: windows
            goarch: amd64
            artifact: chisel-windows-amd64.exe
            binary: chisel.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags="-s -w" -o ${{ matrix.binary }} .

      - name: Verify
        run: file ${{ matrix.binary }} && ls -la ${{ matrix.binary }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          retention-days: 7